name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.cc }} ${{ matrix.buildtype }} ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        buildtype: [debug, release]
        variant: ['']
        include:
          # the default x86-64 target exercises the SSE2 quaternion code;
          # these cover the SSE3 path and the scalar fallback
          - cc: gcc
            buildtype: release
            variant: sse3
            cflags: -march=x86-64-v2
          - cc: gcc
            buildtype: debug
            variant: scalar
            cflags: -DKSL_NO_SIMD
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config check clang libeigen3-dev

      - name: Configure
        run: >
          meson setup build --buildtype=${{ matrix.buildtype }}
          -Dtests=enabled -Ddocs=disabled -Dbench=enabled
          "-Dc_args=${{ matrix.cflags }}" "-Dcpp_args=${{ matrix.cflags }}"

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config check gcovr

      - name: Configure
        run: meson setup build --buildtype=debug -Dtests=enabled -Ddocs=disabled -Db_coverage=true

      - name: Build and test
        run: |
          meson compile -C build
          meson test -C build --print-errorlogs

      - name: Coverage report
        run: |
          ninja -C build coverage-xml coverage-text
          cat build/meson-logs/coverage.txt

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/meson-logs/coverage.xml
            build/meson-logs/coverage.txt

  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build doxygen
          pip install sphinx breathe sphinxcontrib-bibtex

      - name: Build
        run: |
          meson setup build -Dtests=disabled -Ddocs=enabled
          meson compile -C build docs
          touch build/doc/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/doc/html

  deploy-pages:
    name: deploy pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, docs]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
